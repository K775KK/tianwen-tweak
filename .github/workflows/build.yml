# ============================================================
# GitHub Actions - 简化版编译工作流
# 直接用 macOS 自带 clang 编译，不需要 Theos
# ============================================================

name: Build TianwenTweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Compile TianwenTweak.dylib
      run: |
        echo "=== 编译 TianwenTweak.dylib ==="
        
        # 用 macOS 自带 clang 直接编译
        SDK=$(xcrun --sdk iphoneos --show-sdk-path)
        echo "iOS SDK: $SDK"
        
        clang -arch arm64 \
          -isysroot "$SDK" \
          -miphoneos-version-min=14.0 \
          -dynamiclib \
          -framework Foundation \
          -framework UIKit \
          -fobjc-arc \
          -O2 \
          -o TianwenTweak.dylib \
          tweak/tweak.x
        
        echo "=== 编译完成 ==="
        file TianwenTweak.dylib
        ls -la TianwenTweak.dylib

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: TianwenTweak
        path: TianwenTweak.dylib
        retention-days: 30
