name: Build TianwenTweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Fix source file line endings
      run: |
        sed -i '' 's/\r$//' tweak/tweak.x
        head -3 tweak/tweak.x
        echo "File size: $(wc -c < tweak/tweak.x) bytes"

    - name: Show SDK info
      run: |
        xcrun --sdk iphoneos --show-sdk-path
        xcrun --sdk iphoneos --show-sdk-version

    - name: Compile
      run: |
        set -ex
        SDK=$(xcrun --sdk iphoneos --show-sdk-path)
        
        clang -arch arm64 \
          -isysroot "$SDK" \
          -miphoneos-version-min=14.0 \
          -dynamiclib \
          -framework Foundation \
          -fobjc-arc \
          -w \
          -o TianwenTweak.dylib \
          tweak/tweak.x
        
        file TianwenTweak.dylib
        ls -la TianwenTweak.dylib

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: TianwenTweak
        path: TianwenTweak.dylib
        retention-days: 30
