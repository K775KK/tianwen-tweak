name: Build TianwenTweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Compile
      run: |
        set -ex
        SDK=$(xcrun --sdk iphoneos --show-sdk-path)
        
        clang -arch arm64 \
          -isysroot "$SDK" \
          -miphoneos-version-min=14.0 \
          -dynamiclib \
          -framework Foundation \
          -framework UIKit \
          -fobjc-arc \
          -w \
          -x objective-c \
          -o TianwenTweak.dylib \
          tweak/tweak.x
        
        echo "=== OK ==="
        file TianwenTweak.dylib
        ls -la TianwenTweak.dylib

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: TianwenTweak
        path: TianwenTweak.dylib
        retention-days: 30
